<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>curiosity</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .prompt-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            transition: all 0.6s ease;
        }

        .prompt-section.minimized {
            flex: 0 0 80px;
            padding: 1rem 2rem;
            background: #111;
            border-bottom: 1px solid #333;
        }

        .prompt-wrapper {
            max-width: 700px;
            width: 100%;
        }

        .prompt-section.minimized .prompt-wrapper {
            max-width: 100%;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 1rem;
            text-align: center;
            font-weight: 300;
        }

        .prompt-section.minimized h1 {
            font-size: 1.5rem;
            margin-bottom: 0;
            text-align: left;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        .prompt-section.minimized .subtitle {
            display: none;
        }

        .input-container {
            position: relative;
            width: 100%;
        }

        .prompt-section.minimized .input-container {
            flex: 1;
        }

        .prompt-input {
            width: 100%;
            padding: 1.5rem 5rem 1.5rem 1.5rem;
            font-size: 1.1rem;
            border: 1px solid #333;
            border-radius: 4px;
            background: #111;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }

        .prompt-input:focus {
            border-color: #666;
        }

        .prompt-section.minimized .prompt-input {
            padding: 0.8rem 4rem 0.8rem 1.2rem;
            font-size: 1rem;
        }

        .generate-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            padding: 0.8rem 2rem;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .generate-btn:hover:not(:disabled) {
            background: #ddd;
        }

        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .terminal-section {
            display: none;
            background: #111;
            margin: 1rem 2rem;
            padding: 1.5rem;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .terminal-section.active {
            display: block;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #333;
        }

        .terminal-title {
            color: #fff;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .terminal-controls {
            display: flex;
            gap: 0.5rem;
        }

        .terminal-btn {
            background: #333;
            border: none;
            color: #fff;
            padding: 0.3rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .terminal-btn:hover {
            background: #444;
        }

        .terminal-output {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #d4d4d4;
        }

        .terminal-line {
            margin: 2px 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .terminal-line.info {
            color: #ffffff;
        }

        .terminal-line.success {
            color: #ffffff;
        }

        .terminal-line.warning {
            color: #ffffff;
        }

        .terminal-line.error {
            color: #ffffff;
        }

        .connection-status {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .connection-status.connected {
            background: #000000;
            color: white;
        }

        .connection-status.disconnected {
            background: #000000;
            color: white;
        }

        .loading {
            display: none;
            text-align: center;
            color: white;
            margin-top: 2rem;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .split-view {
            flex: 1;
            display: none;
            opacity: 0;
        }

        .split-view.active {
            display: flex;
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #111;
            margin: 1rem;
            border: 1px solid #333;
            overflow: hidden;
        }

        .panel-header {
            padding: 1rem 1.5rem;
            background: #111;
            color: white;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .panel-tools {
            display: flex;
            gap: 0.5rem;
        }

        .tool-btn {
            background: #333;
            border: none;
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .tool-btn:hover {
            background: #444;
        }

        .panel-content {
            flex: 1;
            overflow: auto;
        }

        .code-editor {
            width: 100%;
            height: 100%;
            padding: 1.5rem;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            border: none;
            outline: none;
            resize: none;
            background: #000;
            color: #d4d4d4;
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        .file-tabs {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: #111;
            border-bottom: 1px solid #333;
            overflow-x: auto;
        }

        .file-tab {
            padding: 0.5rem 1rem;
            background: #222;
            border: 1px solid #333;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: background 0.2s ease;
        }

        .file-tab:hover {
            background: #333;
        }

        .file-tab.active {
            background: white;
            color: #000;
            border-color: white;
        }

        .status-bar {
            padding: 0.5rem 1rem;
            background: #111;
            border-top: 1px solid #333;
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }

        .error-message {
            background: #300;
            border: 1px solid #500;
            color: #f55;
            padding: 1rem;
            margin: 1rem 0;
            display: none;
            white-space: pre-wrap;
            font-size: 0.9rem;
        }

        .error-message.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="prompt-section" id="promptSection">
            <div class="prompt-wrapper">
                <h1>CURIOSITY</h1>
                <p class="subtitle">Describe your app and watch it come to life</p>
                
                <div class="input-container">
                    <input 
                        type="text" 
                        class="prompt-input" 
                        id="promptInput"
                        placeholder="e.g., Build a colorful modern todo app"
                    >
                    <button class="generate-btn" id="generateBtn">Generate</button>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Generating your app...</p>
                </div>

                <div class="error-message" id="errorMessage"></div>
            </div>
        </div>

        <div class="terminal-section" id="terminalSection">
            <div class="terminal-header">
                <div class="terminal-title">
                    🖥️ Terminal Output
                    <span class="connection-status disconnected" id="connectionStatus">Disconnected</span>
                </div>
                <div class="terminal-controls">
                    <button class="terminal-btn" id="clearTerminalBtn">Clear</button>
                    <button class="terminal-btn" id="toggleTerminalBtn">Hide</button>
                </div>
            </div>
            <div class="terminal-output" id="terminalOutput"></div>
        </div>

        <div class="split-view" id="splitView">
            <div class="panel">
                <div class="panel-header">
                    <span>Code Editor</span>
                    <div class="panel-tools">
                        <button class="tool-btn" id="copyBtn">Copy</button>
                        <button class="tool-btn" id="downloadBtn">Download</button>
                    </div>
                </div>
                <div class="file-tabs" id="fileTabs"></div>
                <div class="panel-content">
                    <textarea class="code-editor" id="codeEditor" spellcheck="false"></textarea>
                </div>
                <div class="status-bar">
                    <span id="fileInfo">No file selected</span>
                    <span id="lineInfo">Lines: 0</span>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <span>Live Preview</span>
                    <div class="panel-tools">
                        <button class="tool-btn" id="refreshBtn">Refresh</button>
                    </div>
                </div>
                <div class="panel-content">
                    <iframe class="preview-frame" id="previewFrame"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        const state = { 
            files: {}, 
            currentFile: null,
            ws: null,
            isGenerating: false
        };
        
        const promptSection = document.getElementById('promptSection');
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const splitView = document.getElementById('splitView');
        const codeEditor = document.getElementById('codeEditor');
        const previewFrame = document.getElementById('previewFrame');
        const fileTabs = document.getElementById('fileTabs');
        const fileInfo = document.getElementById('fileInfo');
        const lineInfo = document.getElementById('lineInfo');
        const errorMessage = document.getElementById('errorMessage');
        const terminalSection = document.getElementById('terminalSection');
        const terminalOutput = document.getElementById('terminalOutput');
        const connectionStatus = document.getElementById('connectionStatus');
        const clearTerminalBtn = document.getElementById('clearTerminalBtn');
        const toggleTerminalBtn = document.getElementById('toggleTerminalBtn');

        // WebSocket connection
        function connectWebSocket() {
            console.log('🔌 Connecting to WebSocket...');
            state.ws = new WebSocket('ws://localhost:8000/ws');
            
            state.ws.onopen = () => {
                console.log(' WebSocket connected');
                connectionStatus.textContent = 'Connected';
                connectionStatus.className = 'connection-status connected';
                addTerminalLine(' Connected to backend server', 'success');
            };
            
            state.ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'connection') {
                    addTerminalLine(data.message, 'info');
                } else if (data.type === 'log') {
                    addTerminalLine(data.message, 'log');
                } else if (data.type === 'info') {
                    addTerminalLine(data.message, 'info');
                } else if (data.type === 'success') {
                    addTerminalLine(data.message, 'success');
                } else if (data.type === 'warning') {
                    addTerminalLine(data.message, 'warning');
                } else if (data.type === 'error') {
                    addTerminalLine(data.message, 'error');
                }
            };
            
            state.ws.onerror = (error) => {
                console.error('❌ WebSocket error:', error);
                connectionStatus.textContent = 'Error';
                connectionStatus.className = 'connection-status disconnected';
            };
            
            state.ws.onclose = () => {
                console.log('🔌 WebSocket disconnected');
                connectionStatus.textContent = 'Disconnected';
                connectionStatus.className = 'connection-status disconnected';
                
                // Reconnect after 3 seconds if not generating
                if (!state.isGenerating) {
                    setTimeout(connectWebSocket, 3000);
                }
            };
        }

        function addTerminalLine(text, type = 'log') {
            const line = document.createElement('div');
            line.className = `terminal-line ${type}`;
            line.textContent = text;
            terminalOutput.appendChild(line);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        function clearTerminal() {
            terminalOutput.innerHTML = '';
        }

        function toggleTerminal() {
            terminalSection.classList.toggle('active');
            toggleTerminalBtn.textContent = terminalSection.classList.contains('active') ? 'Hide' : 'Show';
        }

        // Event listeners
        generateBtn.addEventListener('click', handleGenerate);
        promptInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleGenerate();
        });
        codeEditor.addEventListener('input', handleCodeChange);
        document.getElementById('copyBtn').addEventListener('click', copyCode);
        document.getElementById('downloadBtn').addEventListener('click', downloadCode);
        document.getElementById('refreshBtn').addEventListener('click', updatePreview);
        clearTerminalBtn.addEventListener('click', clearTerminal);
        toggleTerminalBtn.addEventListener('click', toggleTerminal);

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
            setTimeout(() => {
                errorMessage.classList.remove('active');
            }, 8000);
        }

        async function handleGenerate() {
            const prompt = promptInput.value.trim();
            if (!prompt) {
                showError('Please enter a prompt');
                return;
            }

            state.isGenerating = true;
            generateBtn.disabled = true;
            loading.classList.add('active');
            errorMessage.classList.remove('active');
            
            // Show terminal
            terminalSection.classList.add('active');
            clearTerminal();
            addTerminalLine(' Starting generation process...', 'info');

            try {
                console.log('Sending request to backend...');
                const response = await fetch('http://localhost:8000/api/generate', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ user_prompt: prompt })
                });

                console.log('Response status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error('Backend error (' + response.status + '): ' + errorText);
                }

                const data = await response.json();
                console.log('Received data:', data);
                
                if (data.files && Object.keys(data.files).length > 0) {
                    state.files = data.files;
                    renderFileTabs();
                    const firstFile = Object.keys(state.files)[0];
                    selectFile(firstFile);
                    
                    loading.classList.remove('active');
                    promptSection.classList.add('minimized');
                    splitView.classList.add('active');
                    
                    addTerminalLine(' Files loaded in editor!', 'success');
                } else {
                    showError('No files were generated. Please try again with a different prompt.');
                    addTerminalLine('  No files were generated', 'warning');
                }
            } catch (error) {
                console.error('Generation error:', error);
                showError(error.message + '\n\nMake sure the backend is running on http://localhost:8000');
                addTerminalLine('❌ ' + error.message, 'error');
            } finally {
                loading.classList.remove('active');
                generateBtn.disabled = false;
                state.isGenerating = false;
            }
        }

        function renderFileTabs() {
            fileTabs.innerHTML = '';
            Object.keys(state.files).forEach(filename => {
                const tab = document.createElement('div');
                tab.className = 'file-tab';
                tab.textContent = filename;
                tab.addEventListener('click', () => selectFile(filename));
                fileTabs.appendChild(tab);
            });
        }

        function selectFile(filename) {
            state.currentFile = filename;
            codeEditor.value = state.files[filename] || '';
            
            document.querySelectorAll('.file-tab').forEach(tab => {
                tab.classList.toggle('active', tab.textContent === filename);
            });

            updateFileInfo();
            updatePreview();
        }

        function handleCodeChange() {
            if (state.currentFile) {
                state.files[state.currentFile] = codeEditor.value;
                updateFileInfo();
                updatePreview();
            }
        }

        function updateFileInfo() {
            if (state.currentFile) {
                const lines = codeEditor.value.split('\n').length;
                fileInfo.textContent = state.currentFile;
                lineInfo.textContent = 'Lines: ' + lines;
            }
        }

        function updatePreview() {
            const htmlFile = Object.keys(state.files).find(f => f.endsWith('.html'));
            if (!htmlFile) return;

            let html = state.files[htmlFile];
            const cssFile = Object.keys(state.files).find(f => f.endsWith('.css'));
            const jsFile = Object.keys(state.files).find(f => f.endsWith('.js'));

            if (cssFile && state.files[cssFile]) {
                html = html.replace('</head>', '<style>' + state.files[cssFile] + '</style></head>');
            }
            if (jsFile && state.files[jsFile]) {
                html = html.replace('</body>', '<script>' + state.files[jsFile] + '<\/script></body>');
            }

            const blob = new Blob([html], { type: 'text/html' });
            previewFrame.src = URL.createObjectURL(blob);
        }

        function copyCode() {
            if (!state.currentFile) {
                showError('No file selected');
                return;
            }
            navigator.clipboard.writeText(codeEditor.value).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => btn.textContent = originalText, 2000);
            }).catch(() => {
                codeEditor.select();
                document.execCommand('copy');
                alert('Code copied!');
            });
        }

        function downloadCode() {
            if (!state.currentFile) {
                showError('No file selected');
                return;
            }
            const blob = new Blob([codeEditor.value], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = state.currentFile;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Initialize
        console.log(' Frontend loaded successfully');
        console.log(' Backend API: http://localhost:8000');
        console.log(' Ready to generate apps!');
        
        // Connect WebSocket
        connectWebSocket();
    </script>
</body>
</html>
